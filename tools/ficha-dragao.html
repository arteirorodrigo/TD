<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><title>Ficha de evolução</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Manrope:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
body { margin: 0; background: #f2e4c6; color: #2e1b0e; font: 14px/1.45 Manrope, sans-serif; }
.sheet { width: 1600px; padding: 40px 48px; box-sizing: border-box; }
h1 { font: 700 40px Cinzel, serif; margin: 0; } .sub { color: #6b4c32; margin: 4px 0 26px; font-size: 16px; }
.row { display: flex; gap: 14px; align-items: stretch; }
.card { flex: 1; background: #fffaf0; border: 1px solid #c9a97c; border-radius: 14px; padding: 14px; }
.card img { width: 100%; aspect-ratio: 1; object-fit: contain; border-radius: 10px; background: radial-gradient(circle, #3a2a20, #120c09); }
.arrow { align-self: center; font: 700 34px Cinzel; color: #a0642a; }
.stage { font: 700 12px Manrope; letter-spacing: .12em; text-transform: uppercase; color: #a0642a; margin-top: 10px; }
.name { font: 700 22px Cinzel, serif; margin: 2px 0 6px; }
.sw { display: inline-block; width: 18px; height: 18px; border-radius: 4px; vertical-align: -3px; margin-right: 6px; border: 1px solid #0003; }
dl { display: grid; grid-template-columns: auto 1fr; gap: 2px 10px; margin: 8px 0; } dt { color: #7a5a3c; } dd { margin: 0; font-weight: 700; }
ul { margin: 6px 0 0; padding-left: 18px; } .rec { margin-top: 8px; font-size: 13px; }
.notes { margin-top: 24px; background: #fffaf0; border: 1px dashed #b08a5a; border-radius: 12px; padding: 14px 18px; font-size: 15px; }
</style></head><body><div class="sheet" id="sheet">Gerando…</div>
<script type="module" src="./ficha-dragao.js"></script></body></html>
