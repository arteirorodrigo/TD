<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>O Covil dos Dragões TD</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Manrope:ital,wght@0,400;0,600;0,700;0,800;1,500&display=swap">
<style>
/* Layout: full-bleed 3D board; HUD strip on top, info dock on the right (bottom sheet on phones). */
:root {
  color-scheme: dark;
  --bg: #0b0908;
  --panel: rgba(22, 17, 14, 0.88);
  --panel-solid: #16110e;
  --line: rgba(255, 196, 120, 0.16);
  --fg: #f5ece2;
  --muted: #a8988a;
  --accent: #ffb547;
  --accent-ink: #1c1004;
  --gold: #ffcc4d;
  --danger: #ff5a6a;
  --air: #a99bff;
  --font-display: "Cinzel", Georgia, serif;
  --font-body: "Manrope", "Segoe UI", system-ui, sans-serif;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--fg); font: 14px/1.45 var(--font-body); overflow: hidden; -webkit-tap-highlight-color: transparent; }
#game { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.hud { position: fixed; top: 0; left: 0; right: 0; display: flex; gap: 10px; align-items: center; flex-wrap: wrap;
  padding: calc(env(safe-area-inset-top, 0px) + 10px) max(16px, env(safe-area-inset-right, 0px)) 10px max(16px, env(safe-area-inset-left, 0px));
  pointer-events: none; }
.hud > * { pointer-events: auto; }
.chip { display: flex; align-items: baseline; gap: 6px; padding: 6px 12px; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; backdrop-filter: blur(8px); }
.chip .k { font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.chip .v { font: 700 18px/1 var(--font-display); font-variant-numeric: tabular-nums; }
.chip.lives .v { color: var(--danger); }
.chip.gold .v { color: var(--gold); }
.phase { font: 600 13px var(--font-body); color: var(--fg); padding: 7px 12px; border-radius: 8px; background: rgba(255, 181, 71, .12); border: 1px solid rgba(255, 181, 71, .35); }
.phase.wave { background: rgba(255, 90, 106, .12); border-color: rgba(255, 90, 106, .4); }
.spacer { flex: 1; }
.seg { display: flex; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.seg button { background: none; border: 0; padding: 7px 11px; font: 700 13px var(--font-display); color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }
.btn { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 7px 12px; font-weight: 600; }
.btn:hover { border-color: rgba(140, 180, 255, .4); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: transparent; }
.btn.primary:hover { filter: brightness(1.08); }
.btn.special { background: linear-gradient(90deg, rgba(255, 204, 77, .18), rgba(169, 155, 255, .18)); border-color: rgba(255, 204, 77, .45); }
.btn:disabled { opacity: .4; cursor: not-allowed; }

.dock { position: fixed; right: max(16px, env(safe-area-inset-right, 0px)); top: calc(env(safe-area-inset-top, 0px) + 64px); width: 300px; max-height: calc(100% - 84px - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px));
  display: flex; flex-direction: column; gap: 10px; overflow-y: auto; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; backdrop-filter: blur(10px); }
.card h2 { margin: 0 0 6px; font: 700 15px var(--font-display); letter-spacing: .02em; text-wrap: balance; }
.card h3 { margin: 0 0 8px; font: 600 11px var(--font-body); letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
.row { display: flex; gap: 8px; flex-wrap: wrap; }
.stats { display: grid; grid-template-columns: auto 1fr; gap: 2px 12px; margin: 6px 0; font-variant-numeric: tabular-nums; }
.stats dt { color: var(--muted); }
.stats dd { margin: 0; text-align: right; font-weight: 600; }
.abil { list-style: none; padding: 0; margin: 6px 0 0; display: grid; gap: 3px; }
.abil li { padding-left: 14px; position: relative; color: #e2d4c6; }
.abil li::before { content: ""; position: absolute; left: 2px; top: .6em; width: 6px; height: 6px; border-radius: 1px; transform: rotate(45deg); background: var(--accent); }
.actions { display: grid; gap: 6px; margin-top: 10px; }
.actions .btn { text-align: left; }
.swatch { display: inline-block; width: 10px; height: 10px; border-radius: 2px; transform: rotate(45deg); margin-right: 6px; vertical-align: 1px; box-shadow: 0 0 8px currentColor; }
.slots { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; }
.slot { height: 44px; border-radius: 8px; border: 1px dashed var(--line); display: grid; place-items: center; font: 700 11px var(--font-display); color: var(--muted); background: none; padding: 0; }
.slot.filled { border-style: solid; color: var(--fg); }
.slot.sel { outline: 2px solid #fff; }
.odds { display: flex; height: 8px; border-radius: 4px; overflow: hidden; margin: 6px 0 4px; background: #2a201a; }
.odds span { display: block; height: 100%; }
.legend { display: flex; justify-content: space-between; font-size: 11px; color: var(--muted); font-variant-numeric: tabular-nums; }
.tag { display: inline-block; font: 600 10px var(--font-body); letter-spacing: .06em; text-transform: uppercase; padding: 2px 6px; border-radius: 4px; background: #2a201a; color: #d8c6b4; margin: 2px 4px 0 0; }
.tag.air { background: rgba(169, 155, 255, .18); color: var(--air); }
.hpbar { height: 12px; border-radius: 6px; background: #0c0a08; border: 1px solid #3a2d22; overflow: hidden; margin: 10px 0 4px; }
.hpbar span { display: block; height: 100%; transition: width .1s linear; }
.hptext { font: 600 13px var(--font-body); font-variant-numeric: tabular-nums; margin-bottom: 8px; }
.evo { margin-top: 10px; border-top: 1px solid #2c231b; padding-top: 8px; }
.evo h3 { font: 600 11px var(--font-body); letter-spacing: .08em; text-transform: uppercase; color: #a8957f; margin: 0 0 6px; }
.evo-item { margin-bottom: 8px; }
.evo-item ul { list-style: none; padding: 0; margin: 4px 0 0; font-size: 13px; }
.evo-item li.ok { color: #7dff9e; }
.evo-item li.no { color: #c9b4a0; }
.tier { font: 600 13px var(--font-body); color: #f1dcc4; margin: -2px 0 6px; font-variant-numeric: tabular-nums; }
.tag.boss { background: rgba(255, 204, 77, .18); color: var(--gold); }
.hint { color: var(--muted); font-size: 13px; }
.muted { color: var(--muted); }

.floaters { position: fixed; inset: 0; pointer-events: none; overflow: hidden; }
.floater { position: absolute; font: 700 13px var(--font-display); transform: translate(-50%, -50%); text-shadow: 0 1px 4px #000; white-space: nowrap; }
.floater.gold { color: var(--gold); }
.floater.crit { color: #ff8f6a; font-size: 15px; }
.floater.leak { color: var(--danger); font-size: 15px; }
.floater.miss { color: var(--muted); font-size: 12px; }

.confirm { position: fixed; transform: translate(-50%, calc(-100% - 34px)); display: flex; gap: 6px; z-index: 3; }
.confirm .btn { box-shadow: 0 6px 18px rgba(0, 0, 0, .45); white-space: nowrap; }
.modal { position: fixed; inset: 0; background: rgba(3, 5, 9, .7); display: grid; place-items: center; padding: max(16px, env(safe-area-inset-left, 0px)); z-index: 10; }
.modal .sheet { width: min(860px, 100%); max-height: 86vh; overflow: auto; background: var(--panel-solid); border: 1px solid var(--line); border-radius: 12px; padding: 18px 20px; }
.modal h2 { font: 700 22px var(--font-display); margin: 0 0 4px; }
.recipes { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 10px; margin-top: 12px; }
.recipe { border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; min-width: 0; }
.recipe.ready { border-color: rgba(255, 181, 71, .6); box-shadow: 0 0 0 1px rgba(255, 181, 71, .25) inset; }
.recipe b { font-family: var(--font-display); }
.ing { display: inline-block; font-size: 12px; padding: 1px 6px; border-radius: 4px; background: #261d17; margin: 4px 4px 0 0; }
.ing.have { background: rgba(255, 181, 71, .2); color: var(--accent); }
.center-msg { text-align: center; }
.center-msg .big { font: 700 34px var(--font-display); margin: 4px 0 6px; }


/* ---------- Parchment screens (menu, levels, book, ranking, end) ---------- */
.screen { position: fixed; inset: 0; z-index: 8; overflow: auto; color: #3b2414; background: #e9d3a8 var(--parch-img) center / cover;
  display: flex; flex-direction: column; align-items: center; justify-content: safe center; text-align: center;
  padding: max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(16px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
.screen::after { content: ""; position: fixed; inset: 0; box-shadow: inset 0 0 90px rgba(70, 35, 10, .55); pointer-events: none; }
.screen .kick { font: 600 12px var(--font-display); letter-spacing: .3em; color: #7a5236; text-transform: uppercase; }
.screen h1 { font: 700 clamp(28px, 6vw, 46px)/1.05 var(--font-display); margin: 4px 0; color: #3a2010; }
.screen .rule { width: 170px; height: 1px; background: linear-gradient(90deg, transparent, #8a6a48, transparent); margin: 8px auto; }
.screen .art { width: clamp(90px, 22vh, 190px); aspect-ratio: 1; background: var(--dragon-img) center / contain no-repeat; mix-blend-mode: multiply; margin: 4px 0; }
.screen .tagline { font: italic 500 14px var(--font-body); color: #6b4c32; max-width: 360px; margin: 4px 0 12px; }
.pbtn { font: 700 16px var(--font-display); letter-spacing: .14em; border-radius: 10px; padding: 12px 0; text-align: center; cursor: pointer; }
.pbtn.dark { background: #3b2213; color: #f6e7cc; border: 0; box-shadow: 0 3px 0 #1f1109, 0 6px 14px rgba(60, 30, 10, .35); }
.pbtn.dark:active { transform: translateY(2px); box-shadow: 0 1px 0 #1f1109; }
.pbtn.line { border: 1.5px solid #5a3a22; color: #3b2214; background: rgba(255, 245, 225, .25); font-size: 13px; }
.menu-btns { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; width: min(380px, 100%); }
.menu-btns .dark { grid-column: 1 / -1; }
.screen .record { font: 600 12px var(--font-display); color: #6b4c32; letter-spacing: .06em; margin-top: 10px; min-height: 1em; }
.banners { display: flex; gap: 14px; justify-content: center; flex-wrap: wrap; margin: 18px 0; }
.banner { width: 124px; height: 168px; clip-path: polygon(0 0, 100% 0, 100% 74%, 50% 100%, 0 74%); background: linear-gradient(#4a2c17, #2c180c); color: #f4e3c4;
  display: flex; flex-direction: column; align-items: center; padding-top: 22px; gap: 3px; font: 700 15px var(--font-display); border: 0; border-top: 4px solid #c8902f; }
.banner:hover { filter: brightness(1.15); }
.banner .n { font: 800 32px/1.1 var(--font-body); color: #ffb0a0; }
.banner small { font: 600 11px var(--font-body); color: #d8bf9a; }
.banner .rec { font: 600 10px var(--font-body); color: #e8c98a; margin-top: 4px; }
.banner.danger { background: linear-gradient(#6e1a1a, #3a0c0c); border-top-color: #e2584e; }
.back { position: fixed; left: max(18px, env(safe-area-inset-left, 0px)); bottom: max(14px, env(safe-area-inset-bottom, 0px)); background: none; border: 0; font: 600 14px var(--font-display); color: #5a3a22; z-index: 9; }
.modal .sheet.parch { background: #ead6ad var(--parch-img) center / cover; color: #3b2414; border-color: #8a6a48; }
.modal .sheet.parch .hint, .modal .sheet.parch .muted { color: #6b4c32; }
.modal .sheet.parch .recipe { border-color: rgba(90, 58, 34, .35); background: rgba(255, 248, 232, .35); }
.modal .sheet.parch .ing { background: rgba(90, 58, 34, .14); color: #3b2414; }
.modal .sheet.parch .btn { background: #3b2213; color: #f6e7cc; border-color: transparent; }
.modal .sheet.narrow { width: min(440px, 100%); }
.combo-card { border-color: rgba(255, 204, 77, .55); box-shadow: 0 0 0 1px rgba(255, 204, 77, .2) inset; }
.combo { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 6px 0; border-top: 1px solid var(--line); font-size: 13px; }
.combo:first-child { border-top: 0; }
.combo .btn { padding: 4px 10px; font-size: 12px; white-space: nowrap; }
.sheet.book { width: min(1100px, 100%); }
.line { margin-top: 18px; }
.line h3 { font: 700 15px var(--font-display); letter-spacing: .06em; margin: 0 0 8px; text-transform: none; color: inherit; }
.line-grid { display: grid; grid-template-columns: repeat(4, minmax(200px, 1fr)); gap: 8px; overflow-x: auto; }
.tier-col { display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.tier-h { font: 600 10px var(--font-body); letter-spacing: .12em; text-transform: uppercase; opacity: .7; }
.tier-empty { padding: 10px; text-align: center; }
.recipe.branch { border-style: dashed; opacity: .9; }
.recipe.secret { border-style: dashed; text-align: center; }
.secret-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 8px; }
.menu-btns .wide { grid-column: 1 / -1; }
.edit-only { display: none !important; }
body.editing .edit-only { display: flex !important; }
body.editing .play-only, body.editing .chip, body.editing .seg, body.editing #dock, body.editing #btn-menu { display: none !important; }
.edit-bar { gap: 6px; }
.maze-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 8px 0; border-top: 1px solid rgba(90, 58, 34, .25); }
.maze-row:first-child { border-top: 0; }
.maze-row .btns { display: flex; gap: 6px; }
.maze-name { width: 100%; padding: 8px 10px; border-radius: 8px; border: 1px solid #8a6a48; background: #fffaf0; color: #2e1b0e; font: 600 15px var(--font-body); margin: 8px 0 12px; }
.end-actions { display: flex; gap: 10px; justify-content: center; margin-top: 12px; }
.new-record { color: var(--gold); font: 700 15px var(--font-display); letter-spacing: .1em; }
@media (max-height: 420px) { .screen .tagline, #scr-menu .kick { display: none; } .screen h1 { font-size: 26px; } .screen .rule { margin: 4px auto; } .screen .art { width: 74px; }
  .pbtn { padding: 9px 0; } .screen .record { margin-top: 6px; } .banners { margin: 8px 0; } .banner { height: 140px; padding-top: 14px; } }
@media (max-width: 560px) { .banners { display: grid; grid-template-columns: repeat(2, 124px); } }

@media (max-width: 720px) {
  .chip { padding: 5px 9px; }
  .chip .v { font-size: 16px; }
  .chip .k { display: none; }
  .phase { order: 10; width: 100%; font-size: 12px; }
  .dock { top: auto; bottom: calc(env(safe-area-inset-bottom, 0px) + 10px); left: max(16px, env(safe-area-inset-left, 0px)); right: max(16px, env(safe-area-inset-right, 0px)); width: auto; max-height: 42%; }
  .dock .card.wave-card { display: none; }
}
@media (prefers-reduced-motion: reduce) { .floater { transition: none; } }
</style>
</head>
<body>
<canvas id="game" aria-label="Tabuleiro do jogo"></canvas>
<div class="floaters" id="floaters"></div>
<div class="confirm" id="confirm" hidden>
  <button class="btn primary" id="confirm-ok">Colocar aqui</button>
  <button class="btn" id="confirm-cancel" aria-label="Cancelar">Cancelar</button>
</div>

<header class="hud">
  <button class="btn" id="btn-menu">Menu</button>
  <div class="chip"><span class="k">Fase</span><span class="v" id="hud-level">1</span></div>
  <div class="chip"><span class="v" id="hud-diff" style="font-size:13px">Médio</span></div>
  <div class="chip lives"><span class="k">Vidas</span><span class="v" id="hud-lives">10</span></div>
  <div class="chip gold"><span class="k">Ouro</span><span class="v" id="hud-gold">0</span></div>
  <div class="phase" id="hud-phase">Coloque 5 pedras no mapa</div>
  <div class="spacer"></div>
  <div class="seg" role="group" aria-label="Velocidade">
    <button id="sp1" aria-pressed="true">1x</button><button id="sp2" aria-pressed="false">2x</button><button id="sp4" aria-pressed="false">4x</button>
  </div>
  <button class="btn" id="btn-fit" title="Ver o mapa todo (tecla 0)">Mapa todo</button>
  <button class="btn play-only" id="btn-guide">Guia</button>
  <button class="btn play-only" id="btn-recipes">Dragões</button>
  <div class="edit-only edit-bar">
    <button class="btn primary" id="ed-save">Salvar</button>
    <button class="btn" id="ed-clear">Limpar</button>
    <button class="btn" id="ed-exit">Sair</button>
  </div>
</header>

<aside class="dock" id="dock">
  <section class="card" id="sel-card" hidden></section>
  <section class="card">
    <h3>Pedras desta rodada</h3>
    <div class="slots" id="slots"></div>
  </section>
  <section class="card combo-card" id="combo-card" hidden>
    <h3>Combinações desta rodada</h3>
    <div id="combos"></div>
  </section>
  <section class="card">
    <h3>Sorte das escamas</h3>
    <div class="odds" id="odds"></div>
    <div class="legend" id="odds-legend"></div>
    <div class="row" style="margin-top:8px; align-items:center; justify-content:space-between">
      <span class="muted" id="luck-level">Nível 0</span>
      <button class="btn" id="btn-luck">Melhorar</button>
    </div>
  </section>
  <section class="card wave-card" id="wave-card"></section>
</aside>

<section class="screen" id="scr-menu" hidden>
  <h1>O Covil dos Dragões TD</h1>
  <div class="rule"></div>
  <div class="art" role="img" aria-label="Dragão protegendo o covil"></div>
  <p class="tagline">Os caçadores querem o tesouro do covil. Plante escamas, trace o labirinto e desperte os dragões.</p>
  <div class="menu-btns">
    <button class="pbtn dark" id="m-play">Jogar</button>
    <button class="pbtn line" id="m-ranking">Ranking</button>
    <button class="pbtn line" id="m-book">Livro dos Dragões</button>
    <button class="pbtn line wide" id="m-mazes">Labirintos</button>
  </div>
  <div class="record" id="m-record"></div>
</section>
<section class="screen" id="scr-levels" hidden>
  <div class="kick">Escolha o nível</div>
  <div class="banners" id="banners"></div>
  <button class="back" id="lv-back">← Voltar</button>
</section>

<div class="modal" id="modal" hidden><div class="sheet" id="modal-body"></div></div>

<script type="module" src="./src/main.js"></script>
</body>
</html>
