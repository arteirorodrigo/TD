<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ninho dos Dragões</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Manrope:wght@400;600;700&display=swap">
<style>
/* Layout: full-bleed 3D board; HUD strip on top, info dock on the right (bottom sheet on phones). */
:root {
  color-scheme: dark;
  --bg: #0b0908;
  --panel: rgba(22, 17, 14, 0.88);
  --panel-solid: #16110e;
  --line: rgba(255, 196, 120, 0.16);
  --fg: #f5ece2;
  --muted: #a8988a;
  --accent: #ffb547;
  --accent-ink: #1c1004;
  --gold: #ffcc4d;
  --danger: #ff5a6a;
  --air: #a99bff;
  --font-display: "Cinzel", Georgia, serif;
  --font-body: "Manrope", "Segoe UI", system-ui, sans-serif;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--fg); font: 14px/1.45 var(--font-body); overflow: hidden; -webkit-tap-highlight-color: transparent; }
#game { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.hud { position: fixed; top: 0; left: 0; right: 0; display: flex; gap: 10px; align-items: center; flex-wrap: wrap;
  padding: calc(env(safe-area-inset-top, 0px) + 10px) max(16px, env(safe-area-inset-right, 0px)) 10px max(16px, env(safe-area-inset-left, 0px));
  pointer-events: none; }
.hud > * { pointer-events: auto; }
.chip { display: flex; align-items: baseline; gap: 6px; padding: 6px 12px; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; backdrop-filter: blur(8px); }
.chip .k { font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.chip .v { font: 700 18px/1 var(--font-display); font-variant-numeric: tabular-nums; }
.chip.lives .v { color: var(--danger); }
.chip.gold .v { color: var(--gold); }
.phase { font: 600 13px var(--font-body); color: var(--fg); padding: 7px 12px; border-radius: 8px; background: rgba(255, 181, 71, .12); border: 1px solid rgba(255, 181, 71, .35); }
.phase.wave { background: rgba(255, 90, 106, .12); border-color: rgba(255, 90, 106, .4); }
.spacer { flex: 1; }
.seg { display: flex; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.seg button { background: none; border: 0; padding: 7px 11px; font: 700 13px var(--font-display); color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }
.btn { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 7px 12px; font-weight: 600; }
.btn:hover { border-color: rgba(140, 180, 255, .4); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: transparent; }
.btn.primary:hover { filter: brightness(1.08); }
.btn.special { background: linear-gradient(90deg, rgba(255, 204, 77, .18), rgba(169, 155, 255, .18)); border-color: rgba(255, 204, 77, .45); }
.btn:disabled { opacity: .4; cursor: not-allowed; }

.dock { position: fixed; right: max(16px, env(safe-area-inset-right, 0px)); top: calc(env(safe-area-inset-top, 0px) + 64px); width: 300px; max-height: calc(100% - 84px - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px));
  display: flex; flex-direction: column; gap: 10px; overflow-y: auto; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; backdrop-filter: blur(10px); }
.card h2 { margin: 0 0 6px; font: 700 15px var(--font-display); letter-spacing: .02em; text-wrap: balance; }
.card h3 { margin: 0 0 8px; font: 600 11px var(--font-body); letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
.row { display: flex; gap: 8px; flex-wrap: wrap; }
.stats { display: grid; grid-template-columns: auto 1fr; gap: 2px 12px; margin: 6px 0; font-variant-numeric: tabular-nums; }
.stats dt { color: var(--muted); }
.stats dd { margin: 0; text-align: right; font-weight: 600; }
.abil { list-style: none; padding: 0; margin: 6px 0 0; display: grid; gap: 3px; }
.abil li { padding-left: 14px; position: relative; color: #e2d4c6; }
.abil li::before { content: ""; position: absolute; left: 2px; top: .6em; width: 6px; height: 6px; border-radius: 1px; transform: rotate(45deg); background: var(--accent); }
.actions { display: grid; gap: 6px; margin-top: 10px; }
.actions .btn { text-align: left; }
.swatch { display: inline-block; width: 10px; height: 10px; border-radius: 2px; transform: rotate(45deg); margin-right: 6px; vertical-align: 1px; box-shadow: 0 0 8px currentColor; }
.slots { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; }
.slot { height: 44px; border-radius: 8px; border: 1px dashed var(--line); display: grid; place-items: center; font: 700 11px var(--font-display); color: var(--muted); background: none; padding: 0; }
.slot.filled { border-style: solid; color: var(--fg); }
.slot.sel { outline: 2px solid #fff; }
.odds { display: flex; height: 8px; border-radius: 4px; overflow: hidden; margin: 6px 0 4px; background: #2a201a; }
.odds span { display: block; height: 100%; }
.legend { display: flex; justify-content: space-between; font-size: 11px; color: var(--muted); font-variant-numeric: tabular-nums; }
.tag { display: inline-block; font: 600 10px var(--font-body); letter-spacing: .06em; text-transform: uppercase; padding: 2px 6px; border-radius: 4px; background: #2a201a; color: #d8c6b4; margin: 2px 4px 0 0; }
.tag.air { background: rgba(169, 155, 255, .18); color: var(--air); }
.tag.boss { background: rgba(255, 204, 77, .18); color: var(--gold); }
.hint { color: var(--muted); font-size: 13px; }
.muted { color: var(--muted); }

.floaters { position: fixed; inset: 0; pointer-events: none; overflow: hidden; }
.floater { position: absolute; font: 700 13px var(--font-display); transform: translate(-50%, -50%); text-shadow: 0 1px 4px #000; white-space: nowrap; }
.floater.gold { color: var(--gold); }
.floater.crit { color: #ff8f6a; font-size: 15px; }
.floater.leak { color: var(--danger); font-size: 15px; }
.floater.miss { color: var(--muted); font-size: 12px; }

.confirm { position: fixed; transform: translate(-50%, calc(-100% - 34px)); display: flex; gap: 6px; z-index: 3; }
.confirm .btn { box-shadow: 0 6px 18px rgba(0, 0, 0, .45); white-space: nowrap; }
.modal { position: fixed; inset: 0; background: rgba(3, 5, 9, .7); display: grid; place-items: center; padding: max(16px, env(safe-area-inset-left, 0px)); z-index: 5; }
.modal .sheet { width: min(860px, 100%); max-height: 86vh; overflow: auto; background: var(--panel-solid); border: 1px solid var(--line); border-radius: 12px; padding: 18px 20px; }
.modal h2 { font: 700 22px var(--font-display); margin: 0 0 4px; }
.recipes { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 10px; margin-top: 12px; }
.recipe { border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; min-width: 0; }
.recipe.ready { border-color: rgba(255, 181, 71, .6); box-shadow: 0 0 0 1px rgba(255, 181, 71, .25) inset; }
.recipe b { font-family: var(--font-display); }
.ing { display: inline-block; font-size: 12px; padding: 1px 6px; border-radius: 4px; background: #261d17; margin: 4px 4px 0 0; }
.ing.have { background: rgba(255, 181, 71, .2); color: var(--accent); }
.center-msg { text-align: center; }
.center-msg .big { font: 700 34px var(--font-display); margin: 4px 0 6px; }

@media (max-width: 720px) {
  .chip { padding: 5px 9px; }
  .chip .v { font-size: 16px; }
  .chip .k { display: none; }
  .phase { order: 10; width: 100%; font-size: 12px; }
  .dock { top: auto; bottom: calc(env(safe-area-inset-bottom, 0px) + 10px); left: max(16px, env(safe-area-inset-left, 0px)); right: max(16px, env(safe-area-inset-right, 0px)); width: auto; max-height: 42%; }
  .dock .card.wave-card { display: none; }
}
@media (prefers-reduced-motion: reduce) { .floater { transition: none; } }
</style>
</head>
<body>
<canvas id="game" aria-label="Tabuleiro do jogo"></canvas>
<div class="floaters" id="floaters"></div>
<div class="confirm" id="confirm" hidden>
  <button class="btn primary" id="confirm-ok">Colocar aqui</button>
  <button class="btn" id="confirm-cancel" aria-label="Cancelar">Cancelar</button>
</div>

<header class="hud">
  <div class="chip"><span class="k">Nível</span><span class="v" id="hud-level">1/50</span></div>
  <div class="chip lives"><span class="k">Vidas</span><span class="v" id="hud-lives">10</span></div>
  <div class="chip gold"><span class="k">Ouro</span><span class="v" id="hud-gold">0</span></div>
  <div class="phase" id="hud-phase">Coloque 5 pedras no mapa</div>
  <div class="spacer"></div>
  <div class="seg" role="group" aria-label="Velocidade">
    <button id="sp1" aria-pressed="true">1x</button><button id="sp2" aria-pressed="false">2x</button><button id="sp4" aria-pressed="false">4x</button>
  </div>
  <button class="btn" id="btn-recipes">Dragões</button>
</header>

<aside class="dock" id="dock">
  <section class="card" id="sel-card" hidden></section>
  <section class="card">
    <h3>Pedras desta rodada</h3>
    <div class="slots" id="slots"></div>
  </section>
  <section class="card">
    <h3>Sorte das escamas</h3>
    <div class="odds" id="odds"></div>
    <div class="legend" id="odds-legend"></div>
    <div class="row" style="margin-top:8px; align-items:center; justify-content:space-between">
      <span class="muted" id="luck-level">Nível 0</span>
      <button class="btn" id="btn-luck">Melhorar</button>
    </div>
  </section>
  <section class="card wave-card" id="wave-card"></section>
</aside>

<div class="modal" id="modal" hidden><div class="sheet" id="modal-body"></div></div>

<script type="module" src="./src/main.js"></script>
</body>
</html>
